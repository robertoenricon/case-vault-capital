# Ambiente de desenvolvimento local. Não é usado para deploy.

services:
  api:
    build: ./apps/api
    container_name: vault-api
    command: sh -c "[ -f node_modules/.package-lock.json ] || npm install; exec npm run start:dev"
    env_file: .env
    ports:
      - "${API_PORT}:3000"
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s

  web:
    build: ./apps/web
    container_name: vault-web
    command: sh -c "[ -f node_modules/.package-lock.json ] || npm install; exec npm run dev"
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  api_node_modules:
  web_node_modules:
