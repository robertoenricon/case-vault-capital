# Ambiente de desenvolvimento local. Não é usado para deploy.

services:
  db:
    image: postgres:17-alpine
    container_name: vault-db
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  api:
    build: ./apps/api
    container_name: vault-api
    command: sh -c "[ -f node_modules/.package-lock.json ] || npm install; exec npm run start:dev"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT}:3000"
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s

  web:
    build: ./apps/web
    container_name: vault-web
    command: sh -c "[ -f node_modules/.package-lock.json ] || npm install; exec npm run dev"
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  api_node_modules:
  web_node_modules:
  pgdata:
